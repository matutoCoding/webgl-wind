<!DOCTYPE html>
<html>
<head>
<title>WebGL wind simulation</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
</head>
<style>
body { margin: 0; padding: 0; }
#coastline { background: black; }
#canvas, #coastline { display: block; width: 100vw; height: 100vh; position: absolute; }
#canvas { cursor: grab; }
#canvas.dragging { cursor: grabbing; }
.dg .function .property-name { width: 100%; }
#hover {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 6px 10px;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    font: 13px/1.5 monospace;
    border-radius: 4px;
    pointer-events: none;
    white-space: pre;
}
</style>
<body>
<canvas id="coastline"></canvas>
<canvas id="canvas"></canvas>
<div id="hover" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.6.2/dat.gui.min.js"></script>
<script src="../dist/wind-gl.js"></script>
<script src="index.js" charset="utf-8"></script>
</body>
</html>
